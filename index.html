<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2ff" />
  <title>Motion Heart</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app awaiting-launch" id="app" data-theme="daytime">
    <canvas id="heartCanvas" aria-label="Trái tim ánh sáng động"></canvas>
    <div class="mini-hearts" id="miniHearts" aria-hidden="true"></div>

    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>

    <div class="launch-wrap" id="launchWrap">
      <button class="launch-button" id="launchButton" type="button" aria-label="Giữ để bung trái tim">
        <span class="launch-ring" aria-hidden="true"></span>
        <span class="polaroid-card" aria-hidden="true">
          <span class="polaroid-photo">
            <img src="assets/ha-chang-polaroid.png" alt="" draggable="false" />
          </span>
          <span class="polaroid-caption">to Hà Chang</span>
        </span>
      </button>
    </div>

    <div class="theme-menu-wrap">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Mở menu màu" aria-expanded="false">
        <span class="theme-symbol icon-sun" id="themeIcon" aria-hidden="true"></span>
      </button>

      <nav class="mode-panel closed" id="modePanel" aria-label="Chọn màu sắc">
        <button class="mode-btn" data-theme="predawn" type="button"><span class="mode-icon icon-orbit" aria-hidden="true"></span><b>Pre-dawn</b></button>
        <button class="mode-btn" data-theme="sunrise" type="button"><span class="mode-icon icon-sunrise" aria-hidden="true"></span><b>Sunrise</b></button>
        <button class="mode-btn active" data-theme="daytime" type="button"><span class="mode-icon icon-sun" aria-hidden="true"></span><b>Daytime</b></button>
        <button class="mode-btn" data-theme="dusk" type="button"><span class="mode-icon icon-dusk" aria-hidden="true"></span><b>Dusk</b></button>
        <button class="mode-btn" data-theme="sunset" type="button"><span class="mode-icon icon-sunset" aria-hidden="true"></span><b>Sunset</b></button>
        <button class="mode-btn" data-theme="night" type="button"><span class="mode-icon icon-moon" aria-hidden="true"></span><b>Night</b></button>
      </nav>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
