      <use href="#heartMark" x="270" y="276" width="360" height="330" transform="translate(-180 -165)" fill="url(#dtHeart)" opacity=".23"/>
      <use href="#heartMark" x="270" y="276" width="360" height="330" transform="translate(-180 -165)" fill="none" stroke="url(#dtHeart)" stroke-width="5" opacity=".96"/>
      <use href="#heartMark" x="270" y="296" width="230" height="210" transform="translate(-115 -105)" fill="none" stroke="#ffe5b0" stroke-width="3" opacity=".54"/>
      <circle cx="390" cy="207" r="2.6" fill="#ffe2a4"/><circle cx="150" cy="240" r="2.2" fill="#ff4776"/><circle cx="362" cy="354" r="2.1" fill="#ffd48f"/>
      <text x="34" y="58" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Daytime</text>
      <text x="34" y="94" fill="#ffffff" opacity=".82" font-family="Inter, Arial, sans-serif" font-size="17">coral rose + amber on blue sky</text>
    </g>
  </g>

  <g transform="translate(46 636)">
    <g filter="url(#softShadow)">
      <rect x="0" y="0" width="540" height="520" rx="26" fill="url(#dkBg)"/>
      <circle cx="270" cy="268" r="150" fill="#fff" opacity=".12"/>
      <use href="#heartMark" x="270" y="276" width="360" height="330" transform="translate(-180 -165)" fill="none" stroke="url(#dkHeart)" stroke-width="28" opacity=".30" filter="url(#heartGlow)"/>
      <use href="#heartMark" x="270" y="276" width="360" height="330" transform="translate(-180 -165)" fill="url(#dkHeart)" opacity=".25"/>
      <use href="#heartMark" x="270" y="276" width="360" height="330" transform="translate(-180 -165)" fill="none" stroke="url(#dkHeart)" stroke-width="6" opacity=".98"/>
      <use href="#heartMark" x="270" y="296" width="230" height="210" transform="translate(-115 -105)" fill="none" stroke="#f5ffba" stroke-width="3.5" opacity=".64"/>
      <circle cx="390" cy="207" r="2.6" fill="#fff0a8"/><circle cx="150" cy="240" r="2.2" fill="#58ffd5"/><circle cx="362" cy="354" r="2.1" fill="#fff0a8"/>
      <text x="34" y="58" fill="#fff7ff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Dusk</text>
      <text x="34" y="94" fill="#fff7ff" opacity=".80" font-family="Inter, Arial, sans-serif" font-size="17">aqua lime + gold on deep dusk</text>
    </g>
  </g>

  <g transform="translate(630 636)">
    <g filter="url(#softShadow)">
      <rect x="0" y="0" width="540" height="520" rx="26" fill="url(#ssBg)"/>
      <circle cx="270" cy="268" r="150" fill="#fff" opacity=".12"/>
      <use href="#heartMark" x="270" y="276" width="360" height="330" transform="translate(-180 -165)" fill="none" stroke="url(#ssHeart)" stroke-width="22" opacity=".22" filter="url(#heartGlow)"/>
      <use href="#heartMark" x="270" y="276" width="360" height="330" transform="translate(-180 -165)" fill="url(#ssHeart)" opacity=".20"/>
      <use href="#heartMark" x="270" y="276" width="360" height="330" transform="translate(-180 -165)" fill="none" stroke="url(#ssHeart)" stroke-width="5" opacity=".96"/>
      <use href="#heartMark" x="270" y="296" width="230" height="210" transform="translate(-115 -105)" fill="none" stroke="#c8fbff" stroke-width="3" opacity=".52"/>
      <circle cx="390" cy="207" r="2.6" fill="#b8f9ff"/><circle cx="150" cy="240" r="2.2" fill="#1520ff"/><circle cx="362" cy="354" r="2.1" fill="#b8f9ff"/>
