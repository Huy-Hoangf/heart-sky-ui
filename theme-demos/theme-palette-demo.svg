      <circle cx="270" cy="268" r="150" fill="#fff" opacity=".14"/>
      <use href="#heartMark" x="270" y="276" width="360" height="330" transform="translate(-180 -165)" fill="none" stroke="url(#pdHeart)" stroke-width="28" opacity=".30" filter="url(#heartGlow)"/>
      <use href="#heartMark" x="270" y="276" width="360" height="330" transform="translate(-180 -165)" fill="url(#pdHeart)" opacity=".27"/>
      <use href="#heartMark" x="270" y="276" width="360" height="330" transform="translate(-180 -165)" fill="none" stroke="url(#pdHeart)" stroke-width="6" opacity=".98"/>
      <use href="#heartMark" x="270" y="296" width="230" height="210" transform="translate(-115 -105)" fill="none" stroke="#fff7b0" stroke-width="3.5" opacity=".66"/>
      <circle cx="392" cy="206" r="2.6" fill="#fff4bc"/><circle cx="147" cy="236" r="2.2" fill="#ff71a7"/><circle cx="360" cy="354" r="2.1" fill="#fff4bc"/>
      <text x="34" y="58" fill="#f8f3ff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Pre-dawn</text>
      <text x="34" y="94" fill="#f8f3ff" opacity=".78" font-family="Inter, Arial, sans-serif" font-size="17">bright amber + rose on deep violet</text>
    </g>
  </g>

  <g transform="translate(630 44)">
    <g filter="url(#softShadow)">
      <rect x="0" y="0" width="540" height="520" rx="26" fill="url(#srBg)"/>
      <circle cx="270" cy="268" r="150" fill="#fff" opacity=".12"/>
      <use href="#heartMark" x="270" y="276" width="360" height="330" transform="translate(-180 -165)" fill="none" stroke="url(#srHeart)" stroke-width="22" opacity=".22" filter="url(#heartGlow)"/>
      <use href="#heartMark" x="270" y="276" width="360" height="330" transform="translate(-180 -165)" fill="url(#srHeart)" opacity=".20"/>
      <use href="#heartMark" x="270" y="276" width="360" height="330" transform="translate(-180 -165)" fill="none" stroke="url(#srHeart)" stroke-width="5" opacity=".94"/>
      <use href="#heartMark" x="270" y="296" width="230" height="210" transform="translate(-115 -105)" fill="none" stroke="#b6fff8" stroke-width="3" opacity=".50"/>
      <circle cx="387" cy="210" r="2.6" fill="#a9fff7"/><circle cx="150" cy="240" r="2.2" fill="#1b25ff"/><circle cx="366" cy="354" r="2.1" fill="#a9fff7"/>
      <text x="34" y="58" fill="#fff8ef" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Sunrise</text>
      <text x="34" y="94" fill="#fff8ef" opacity=".80" font-family="Inter, Arial, sans-serif" font-size="17">royal blue + aqua on warm sky</text>
