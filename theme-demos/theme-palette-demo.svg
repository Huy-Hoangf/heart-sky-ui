      <text x="34" y="94" fill="#fff9f2" opacity=".82" font-family="Inter, Arial, sans-serif" font-size="17">deep blue + cyan on hot sunset</text>
    </g>
  </g>

  <g transform="translate(1214 636)">
    <g filter="url(#softShadow)">
      <rect x="0" y="0" width="540" height="520" rx="26" fill="url(#ngBg)"/>
      <circle cx="270" cy="268" r="150" fill="#fff2b8" opacity=".12"/>
      <use href="#heartMark" x="270" y="276" width="360" height="330" transform="translate(-180 -165)" fill="none" stroke="url(#ngHeart)" stroke-width="22" opacity=".28" filter="url(#heartGlow)"/>
      <use href="#heartMark" x="270" y="276" width="360" height="330" transform="translate(-180 -165)" fill="url(#ngHeart)" opacity=".24"/>
      <use href="#heartMark" x="270" y="276" width="360" height="330" transform="translate(-180 -165)" fill="none" stroke="url(#ngHeart)" stroke-width="5" opacity=".98"/>
      <use href="#heartMark" x="270" y="296" width="230" height="210" transform="translate(-115 -105)" fill="none" stroke="#fff2aa" stroke-width="3" opacity=".56"/>
      <circle cx="390" cy="207" r="2.6" fill="#fff2aa"/><circle cx="150" cy="240" r="2.2" fill="#ff5c9c"/><circle cx="362" cy="354" r="2.1" fill="#fff2aa"/>
      <text x="34" y="58" fill="#f5f8ff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Night</text>
      <text x="34" y="94" fill="#f5f8ff" opacity=".80" font-family="Inter, Arial, sans-serif" font-size="17">champagne + rose on deep night</text>
    </g>
  </g>
</svg>
