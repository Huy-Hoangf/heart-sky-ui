      <stop offset="0" stop-color="#1018ff"/>
      <stop offset="1" stop-color="#00d9ff"/>
    </linearGradient>

    <radialGradient id="ngBg" cx="22%" cy="18%" r="100%">
      <stop offset="0" stop-color="#5e6fdc"/>
      <stop offset=".52" stop-color="#29368f"/>
      <stop offset="1" stop-color="#151847"/>
    </radialGradient>
    <linearGradient id="ngHeart" x1="16%" y1="16%" x2="84%" y2="84%">
      <stop offset="0" stop-color="#ffdc72"/>
      <stop offset="1" stop-color="#ff3a8c"/>
