    <symbol id="heartMark" viewBox="-180 -160 360 330">
      <path d="M0 132 C-116 42 -164 -20 -148 -82 C-136 -132 -72 -150 -22 -100 C-10 -88 -4 -74 0 -58 C4 -74 10 -88 22 -100 C72 -150 136 -132 148 -82 C164 -20 116 42 0 132Z"/>
